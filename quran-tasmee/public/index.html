<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سباق سورة العصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* VOICE: joyful, loud colours, almost no reading needed — five-year-olds listen, repeat, cheer
   IDEA: a toy race track on a sunny playmat; a kind sheikh recites, the child repeats, the car leaps
   PICTURE: the track plus a big animated sheikh whose mouth moves while reciting, and a child who takes the turn
   COLOUR and TYPE: sun yellow ground, asphalt + grass, coral and sky cars; Baloo Bhaijaan 2 for play, Amiri for ayat
   LAYOUT: title, track, then one stage card: character on one side, giant icon buttons on the other; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#ffd23f,#1c1838);--bg2:light-dark(#fff1b8,#2a2552);
--ink:light-dark(#2b2118,#fff6e0);--card:light-dark(#fffdf6,#2f2a5c);--line:light-dark(#f0d9a0,#463f80);
--road:#3a3d4a;--grass:#5dbb46;--coral:#ff5a5f;--sky:#2b86e9;--gold:#ffb703;--ok:#2fae5b;--plum:#8e5bd8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Baloo Bhaijaan 2",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(16px,3vw,32px) max(4vw,12px)}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;text-wrap:balance;font-weight:800}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,label:focus-within{outline:4px solid var(--sky);outline-offset:3px}
.pill{min-height:44px;padding:4px 16px;border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:16px}
/* track */
.track{margin-top:14px;background:var(--grass);border-radius:26px;padding:14px 12px 8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 8px 0 rgba(0,0,0,.08)}
.lane{position:relative;height:84px;background:var(--road);border-radius:16px;margin-bottom:10px;overflow:hidden;
 background-image:linear-gradient(90deg,#fff 50%,transparent 0);background-size:34px 4px;background-repeat:repeat-x;background-position:0 50%}
.lane::after{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:46px;background:conic-gradient(#fff 25%,#222 0 50%,#fff 0 75%,#222 0) 0 0/16px 16px}
.tag{position:absolute;top:4px;inset-inline-start:10px;font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);padding:0 10px;border-radius:99px;z-index:2}
.car{position:absolute;bottom:6px;width:86px;height:50px;inset-inline-start:calc((100% - 150px) * var(--p,0) / 8 + 8px);transition:inset-inline-start .9s cubic-bezier(.3,1.5,.5,1);z-index:3}
.car svg{width:100%;height:100%;display:block}
.car.hop svg{animation:hop .6s}
@keyframes hop{40%{transform:translateY(-14px) rotate(4deg)}}
.trophy{position:absolute;inset-inline-end:58px;top:50%;translate:0 -50%;width:58px;height:66px}
.ruler{display:flex;justify-content:space-between;padding:0 8px 0 150px}
.ruler span{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center}
.ruler span.on{background:var(--gold)}
.ruler svg{width:16px;height:16px;fill:#fff}
/* stage */
.card{background:var(--card);border-radius:28px;padding:clamp(16px,3vw,30px);box-shadow:0 8px 0 var(--line);margin-top:6px}
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(14px,3vw,30px);align-items:center}
.who{position:relative;background:var(--bg2);border-radius:26px;aspect-ratio:1/1;max-height:340px;display:grid;place-items:center;overflow:hidden}
.who>svg{width:86%;height:86%}
.mouth{transform-origin:100px 132px;transform:scaleY(.35)}
.talk .mouth{animation:talk .32s infinite alternate}
@keyframes talk{to{transform:scaleY(1)}}
.wave{opacity:0}.talk .wave{animation:wave 1.2s infinite}.talk .wave.w2{animation-delay:.4s}
@keyframes wave{0%{opacity:0;transform:scale(.8)}40%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.kid .arm{animation:wav .5s infinite alternate;transform-origin:150px 150px}
@keyframes wav{to{transform:rotate(-18deg)}}
.badge{position:absolute;top:10px;inset-inline-start:10px;font-weight:800;font-size:17px;color:#fff;padding:2px 14px;border-radius:99px}
.step{font-weight:800;font-size:clamp(22px,3.4vw,30px);line-height:1.25;margin:0 0 8px}
.ayah{font-family:Amiri,serif;font-size:clamp(24px,4vw,34px);line-height:2;text-align:center;padding:8px 14px;border-radius:18px;background:var(--bg2);margin:0 0 14px;transition:filter .3s;cursor:pointer}
.ayah.hid{filter:blur(12px)}
.ayah .no{color:var(--coral);font-size:.8em}
.acts{display:grid;gap:12px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;min-height:80px;padding:8px 22px;border-radius:24px;color:#fff;font-size:clamp(24px,3.6vw,30px);font-weight:800;box-shadow:0 7px 0 #0003;transition:transform .1s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #0003}
.big svg{width:44px;height:44px;fill:#fff;flex:none}
.big[disabled]{cursor:default;opacity:.95}
.b-listen{background:var(--sky)}.b-say{background:var(--coral)}.b-ok{background:var(--ok)}.b-again{background:var(--plum)}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.meter{position:relative;height:44px;border-radius:99px;background:var(--bg2);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:18px}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:#ffb703;animation:fill linear forwards}
.meter span{position:relative}
@keyframes fill{to{width:100%}}
.b-ok[disabled]{background:#b8b8b8;box-shadow:0 7px 0 #0002;opacity:1;cursor:not-allowed}
.heard{min-height:30px;font-family:Amiri,serif;font-size:20px;text-align:center;opacity:.8}
.verdict{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;color:#fff;font-size:44px;font-weight:800;animation:pop .4s}
.verdict small{font:400 18px/1.5 Amiri,serif;padding:0 14px;text-align:center}
.verdict svg{width:120px;height:120px;fill:#fff}.v-ok{background:#2fae5bee}.v-no{background:#ff5a5fee}.v-mid{background:#8a8f9cee}
.ayah .w.bad{color:var(--coral);text-decoration:underline wavy;text-underline-offset:10px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.micnote{margin:10px 0 0;padding:8px 16px;border-radius:16px;background:var(--card);font-weight:700;font-size:16px}
.micnote.ok{color:var(--ok)}.micnote.no{color:#d23a3f}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{background:none;text-decoration:underline;font-size:16px;min-height:44px;opacity:.8}
.msg{min-height:38px;font-size:24px;font-weight:800;text-align:center}
.msg.good{color:var(--ok)}.msg.try{color:var(--plum)}
.note{font-size:14px;opacity:.75;margin:6px 0 0}
.center{text-align:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}.stars svg{width:64px;height:64px}
.ov{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:14px;z-index:20;overflow:auto}
.ov.show{display:grid}.ov .card{max-width:640px;width:100%}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.slot .t{font-family:Amiri,serif;font-size:22px;line-height:1.6}
.slot .st{font-size:15px;font-weight:700}.slot .st.y{color:var(--ok)}
.file{display:inline-flex;align-items:center;min-height:44px;padding:4px 16px;border-radius:14px;background:var(--sky);color:#fff;font-weight:700;cursor:pointer;font-size:16px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.slot a{color:var(--sky);font-size:15px;font-weight:700}
.scene{position:relative;height:clamp(250px,44vw,400px);border-radius:18px;overflow:hidden;background:linear-gradient(#8fd8ff,#d9f4ff);margin-bottom:8px}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.track.three .ruler{padding:0 8px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media(max-width:600px){.lane{height:70px}.car{width:68px;height:40px;inset-inline-start:calc((100% - 120px) * var(--p,0) / 8 + 6px)}
 .trophy{width:44px;height:50px;inset-inline-end:52px}.ruler{padding-inline-start:110px}.ruler span{width:20px;height:20px}.ruler svg{width:12px;height:12px}
 .stage{grid-template-columns:1fr}.who{max-height:230px;aspect-ratio:auto;height:230px}.big{min-height:72px}.modes{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.car{transition:none}*{animation:none!important}}
</style>
</head>

<header class="band"><div class="wrap">
 <div class="top">
  <h1>احفظ سورة العصر وانطلق نحو الفوز</h1>
  <div class="tools"><button class="pill" id="micBtn">تفعيل المايك</button><button class="pill" id="setBtn">تلاوة الشيخ</button><button class="pill" id="sndBtn" aria-pressed="true">الأصوات: تعمل</button></div>
 </div>
 <p class="micnote" id="micNote" hidden></p>
 <div class="track" id="track"></div>
</div></header>

<main class="band" style="padding-top:0"><div class="wrap"><div class="card" id="stage"></div></div></main>

<div class="ov" id="ov"><div class="card">
 <p class="step" style="margin-bottom:0">تلاوة الشيخ (للمعلمة)</p>
 <p class="note">تلاوة الشيخ مشاري العفاسي مضافة إلى اللعبة. اضغطي «تجربة» لسماع كل آية، أو اختاري ملفًا آخر لتغيير القارئ على هذا الجهاز.</p>
 <div id="slots"></div>
 <p class="note">دون ملفات صوت تعمل اللعبة أيضًا: يتحرك الشيخ وتقرأ المعلمة الآية بصوتها.</p>
 <div style="display:flex;justify-content:center;margin-top:14px"><button class="big b-listen" id="closeOv" style="min-height:60px">تم</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
{
const AY=['وَالْعَصْرِ','إِنَّ الْإِنسَانَ لَفِي خُسْرٍ','إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ'];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const txt=ks=>ks.map(k=>`${AY[k].split(' ').map((w,i)=>`<span class="w" data-v="${k+1}" data-w="${i+1}">${w}</span>`).join(' ')} <span class="no">﴿${AR(k+1)}﴾</span>`).join(' ');
const FALLBACK=[3500,5000,11000];
/* steps: learn = sheikh recites then child repeats; next = sheikh recites one, child continues with the next; solo = child alone */
const S=[
 {k:'learn',play:[0],say:[0],t:'الآية الأولى'},
 {k:'learn',play:[1],say:[1],t:'الآية الثانية'},
 {k:'learn',play:[0,1],say:[0,1],t:'الآيتان معًا'},
 {k:'learn',play:[2],say:[2],t:'الآية الثالثة'},
 {k:'next',play:[0],say:[1],t:'تحدٍّ: الشيخ يبدأ وأنت تكمل'},
 {k:'next',play:[1],say:[2],t:'تحدٍّ: كمّل بعد الشيخ'},
 {k:'solo',play:[],say:[0],t:'تحدٍّ: ابدأ السورة وحدك'},
 {k:'solo',play:[],say:[0,1,2],t:'السورة كاملة وحدك'}
];
const N=S.length;
const TEAMS=[{name:'فريق النجوم',hex:'#ff5a5f'},{name:'فريق الأقمار',hex:'#2b86e9'}];
let mode=1,teams=[],turn=0,busy=false,sound=true,actx=null,timer=0,player=new Audio();
const clips=['aud/103001.mp3','aud/103002.mp3','aud/103003.mp3'];
try{for(let i=0;i<3;i++){const v=localStorage.getItem('asr-clip-'+i);if(v)clips[i]=v}}catch(e){}
const DUR=FALLBACK.map(x=>x/1000);
clips.forEach((u,i)=>{const a=new Audio();a.preload='auto';a.onloadedmetadata=()=>{if(isFinite(a.duration)&&a.duration>0)DUR[i]=a.duration};a.src=u});
const $=id=>document.getElementById(id),stage=$('stage'),track=$('track');

function tone(seq){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
 seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const yay=()=>tone([[523,.15],[659,.15],[784,.15],[1047,.35]]),soft=()=>tone([[440,.2],[392,.3]]),vroom=()=>tone([[120,.1],[160,.1],[220,.1],[300,.2]]);

/* ---------- 3D world ---------- */
const STEP=6;let W3=null;
function init3D(){
 if(!window.THREE)return null;
 try{
  const T=THREE,r=new T.WebGLRenderer({antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.shadowMap.enabled=true;
  const sc=new T.Scene();sc.background=new T.Color('#9fe0ff');sc.fog=new T.Fog('#9fe0ff',30,90);
  const cam=new T.PerspectiveCamera(50,2,.1,200);
  sc.add(new T.HemisphereLight('#ffffff','#5dbb46',.75));
  const sun=new T.DirectionalLight('#fff4d6',.9);sun.position.set(10,20,8);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:80});sc.add(sun);sc.add(sun.target);
  const M=c=>new T.MeshLambertMaterial({color:c});
  const L=N*STEP+16;
  const grass=new T.Mesh(new T.PlaneGeometry(120,L+80),M('#5dbb46'));grass.rotation.x=-Math.PI/2;grass.position.z=-L/2+6;grass.receiveShadow=true;sc.add(grass);
  const road=new T.Mesh(new T.PlaneGeometry(8,L),M('#3a3d4a'));road.rotation.x=-Math.PI/2;road.position.set(0,.01,-L/2+8);road.receiveShadow=true;sc.add(road);
  for(let z=6;z>-L+8;z-=2.4){const d=new T.Mesh(new T.BoxGeometry(.18,.02,1.2),M('#ffffff'));d.position.set(0,.02,z);sc.add(d)}
  [-4.1,4.1].forEach(x=>{for(let z=6;z>-L+8;z-=1.2){const c=new T.Mesh(new T.BoxGeometry(.3,.12,1.2),M(Math.round(z/1.2)%2?'#ff5a5f':'#ffffff'));c.position.set(x,.06,z);sc.add(c)}});
  // checkered finish
  const cv=document.createElement('canvas');cv.width=128;cv.height=32;const g=cv.getContext('2d');
  for(let x=0;x<16;x++)for(let y=0;y<4;y++){g.fillStyle=(x+y)%2?'#222':'#fff';g.fillRect(x*8,y*8,8,8)}
  const tex=new T.CanvasTexture(cv);const fz=-N*STEP;
  const fin=new T.Mesh(new T.PlaneGeometry(8,2),new T.MeshLambertMaterial({map:tex}));fin.rotation.x=-Math.PI/2;fin.position.set(0,.03,fz);sc.add(fin);

 $('acts').innerHTML=`<div class="meter"><i id="bar" style="animation-duration:${need}s"></i><span id="mt">الطفل يقرأ الآن...</span></div>
 <div class="judge"><button class="big b-ok" id="ok" disabled aria-label="ردّدها صحيحًا"><svg><use href="#okS"/></svg>صح</button>
 <button class="big b-again" id="ag" aria-label="نحاول مرة أخرى"><svg><use href="#agS"/></svg>مرة أخرى</button></div>
 <p class="note center" id="jn">يُفتح زر «صح» بعد أن ينهي الطفل القراءة</p>`;
 const ok=$('ok');ok.onclick=good;$('ag').onclick=()=>{clearTimeout(timer);again()};
 timer=setTimeout(()=>{ok.disabled=false;ok.classList.add('pulse');$('mt').textContent='انتهى وقت القراءة';$('jn').textContent=note||'تضغط المعلمة «صح» إذا ردّدها الطفل صحيحًا';$('who').classList.remove('talk')},need*1000);
}
const PRAISE=['أحسنت! انطلق','ما شاء الله!','بطل! إلى الأمام','رائع جدًا!'];
function say(t,c){const m=$('msg');m.textContent=t;m.className='msg '+c}
function good(){
 if(busy)return;busy=true;const T=teams[turn];$('who').classList.remove('talk');
 yay();vroom();say(PRAISE[Math.floor(Math.random()*PRAISE.length)],'good');$('ay').classList.remove('hid');
 T.pos++;moveCar(turn);burst(30);
 setTimeout(()=>{if(T.pos>=N)return win(T);if(mode===2)turn=1-turn;ask()},1800);
}
function again(){
 if(busy)return;const T=teams[turn];T.miss++;soft();$('who').classList.remove('talk','kid');
 if(mode===2){busy=true;say('محاولة جميلة! الدور للفريق الآخر','try');setTimeout(()=>{turn=1-turn;ask()},2200)}
 else{say('لا بأس، نسمعها مرة أخرى','try');setTimeout(ask,1500)}
}
function win(T){
 tone([[523,.2],[659,.2],[784,.2],[1047,.2],[784,.15],[1047,.5]]);burst(180);if(W3)setTimeout(()=>{W3.win=true},900);
 const st=mode===1?(T.miss===0?3:T.miss<=3?2:1):3;
 stage.innerHTML=`<div class="center">
  <svg style="width:110px;height:124px"><use href="#trophyS"/></svg>
  <p class="step" style="font-size:clamp(30px,5vw,42px)">${mode===2?'فاز '+T.name+'!':'وصلت إلى الكأس!'}</p>
  <div class="stars">${[0,1,2].map(i=>`<svg style="fill:${i<st?'#ffb703':'#0002'}"><use href="#starS"/></svg>`).join('')}</div>
  <p class="step" style="font-size:22px">أنت بطل سورة العصر</p>
  <div class="ayah" style="cursor:default">${txt([0,1,2])}</div>
  <div class="modes" style="max-width:560px;margin:0 auto"><button class="big b-say" id="againB"><svg><use href="#agS"/></svg>العب مرة أخرى</button><button class="big b-listen" id="homeB">البداية</button></div></div>`;
 $('againB').onclick=()=>start(mode);$('homeB').onclick=home;
}
/* recitation setup */
const NAMES=['الآية الأولى','الآية الثانية','الآية الثالثة'];
function drawSlots(){
 $('slots').innerHTML=AY.map((a,i)=>`<div class="slot"><div><div class="t">${a}</div>
  <span class="st${clips[i]?' y':''}">${clips[i]?'تمت إضافة التلاوة':'لا يوجد صوت بعد'}</span> ·
  <a href="https://everyayah.com/data/Alafasy_128kbps/10300${i+1}.mp3" target="_blank" rel="noopener">تحميل ${NAMES[i]}</a></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><label class="file">اختيار ملف<input type="file" accept="audio/*" data-i="${i}"></label>
  ${clips[i]?`<button class="pill" data-t="${i}">تجربة</button>`:''}</div></div>`).join('');
 $('slots').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const i=+inp.dataset.i,r=new FileReader();
  r.onload=()=>{clips[i]=r.result;try{localStorage.setItem('asr-clip-'+i,r.result)}catch(e){}drawSlots()};r.readAsDataURL(f)});
 $('slots').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{stopAudio();player.src=clips[+b.dataset.t];player.play().catch(()=>{})});
}
function micNote(t,ok){const n=$('micNote');n.hidden=false;n.textContent=t;n.className='micnote '+(ok?'ok':'no')}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
$('micBtn').onclick=()=>{
 if(!canRecord()){micNote(isIOS?'المايك غير متاح هنا. افتحي الرابط في Safari.':'المايك غير متاح في هذا المتصفح. افتحي الرابط في Chrome.',false);return}
 micNote('اضغطي «سماح» عندما يطلب الجهاز إذن المايك...',true);
 getMic().then(()=>{releaseMic();manualOnly=false;$('micBtn').textContent='المايك جاهز';
  micNote(!CFG.serviceConfigured?'المايك جاهز، لكن مصحّح التلاوة غير مضبوط على الخادم بعد؛ سيبقى التصحيح يدويًا.':
   CFG.autoLights?'المايك جاهز! يُرسل صوت الطفل إلى مصحّح التلاوة ثم يُحذف.':'المايك جاهز. المصحّح الآلي في وضع الاختبار حتى تعتمده المعلمة، والتصحيح الآن يدوي.',true)})
 .catch(e=>{manualOnly=true;
  micNote(e&&e.code==='not_granted'?'تم رفض إذن المايك. افتحي إعدادات المتصفح ← أذونات الموقع ← الميكروفون واختاري «سماح»، ثم أعيدي فتح اللعبة.':'تعذّر تشغيل المايك هنا. سيبقى التصحيح يدويًا.',false)})};
$('setBtn').onclick=()=>{stopAudio();drawSlots();$('ov').classList.add('show')};
$('closeOv').onclick=()=>{stopAudio();$('ov').classList.remove('show');if(!teams.length)home()};
$('sndBtn').onclick=()=>{sound=!sound;const b=$('sndBtn');b.textContent='الأصوات: '+(sound?'تعمل':'مغلقة');b.setAttribute('aria-pressed',sound)};
/* confetti */
const fx=$('fx'),cx=fx.getContext('2d');let parts=[],raf=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(n){if(reduce)return;fx.width=innerWidth;fx.height=innerHeight;
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:6+Math.random()*7,c:['#ff5a5f','#2b86e9','#ffb703','#5dbb46','#8e5bd8'][i%5],r:Math.random()*6,l:90+Math.random()*40});
 if(!raf)raf=requestAnimationFrame(step)}
function step(){cx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l-->0);
 parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
 raf=parts.length?requestAnimationFrame(step):0;if(!raf)cx.clearRect(0,0,fx.width,fx.height)}
home();
}
</script>
</body>
